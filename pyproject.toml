[build-system]
requires = ["setuptools>=68"]
# backend próprio: setuptools.build_meta + faxina de build/ e egg-info
# obsoletos ANTES de empacotar — um build/lib de branch antigo já contaminou
# wheel/venv com skills fantasma (24/08/2026). Ver o docstring do módulo.
# Em subdiretório DEDICADO por lei: backend-path entra no sys.path do build,
# e a raiz aqui tem `packaging/` — que sombrearia o packaging do setuptools.
build-backend = "empacotamento_limpo"
backend-path = ["_backend"]

[project]
name = "nomos"
version = "1.3.0rc20"
description = "NOMOS Personal Agent Foundry — plataforma local-first que instala, configura, governa e executa o agente pessoal do usuário"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Se7enpay"}]
readme = "README.md"
# `tzdata` SÓ no Windows: Linux e macOS trazem a base de fusos IANA no
# sistema (`/usr/share/zoneinfo`), o Windows não traz nenhuma. Sem ela o
# `zoneinfo` da stdlib não resolve NEM `UTC`, e como `adapters/agenda.py`
# passa toda agenda por `resolver_tz`, o scheduler inteiro fica indisponível
# lá. Condicionada, e não incondicional, para não carregar ~1 MB de dados
# redundantes onde o SO já os tem. Ver tests/test_portabilidade_fusos.py.
dependencies = [
    "cryptography>=46.0.7",
    "argon2-cffi>=23.1",
    'tzdata; sys_platform == "win32"',
]

[project.optional-dependencies]
cerebro = ["llama-cpp-python>=0.2.0"]
arquivos = ["pypdf>=4.0"]
mosaic = ["playwright>=1.40"]
# `tzdata` aqui é INCONDICIONAL de propósito, ao contrário da dependência de
# runtime: o teste de portabilidade de fusos remove os diretórios do SO da
# busca para reproduzir a condição do Windows, e sem o pacote instalado ele
# ficaria vermelho em Linux/macOS por falta do que o Windows receberia em
# produção. Com ele, os 3 SO da matriz exercitam o MESMO caminho de código.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "build>=1.2", "tzdata"]

[project.urls]
Homepage = "https://github.com/Voltolini-SPACE/NOMOS"
Repository = "https://github.com/Voltolini-SPACE/NOMOS"
Changelog = "https://github.com/Voltolini-SPACE/NOMOS/blob/main/CHANGELOG.md"

[project.scripts]
nomos = "nomos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S110"]
ignore = ["E731"]

# P2-11 da auditoria de 2026-07-17: sem esta seção, `mypy src/nomos` (ou
# qualquer escopo que inclua conectores/mcp/) ABORTA com "Duplicate module
# named 'servidor'" antes de checar qualquer coisa — os 7 conectores MCP
# (calendario/email-imap/email-smtp/signal/slack/telegram/whatsapp-cloud)
# têm cada um seu próprio servidor.py sem __init__.py nos diretórios, e o
# mypy tenta importá-los como módulos Python normais com o mesmo nome.
# Não são módulos: cada servidor.py roda como script standalone via
# subprocess (ver conectores/mcp/_comum.py) — nunca são importados pelo
# pacote nomos. Excluir é a correção correta (reflete a arquitetura real);
# adicionar __init__.py criaria um segundo caminho de import que nunca é
# usado, quebrando o isolamento deliberado desses conectores.
[tool.mypy]
ignore_missing_imports = true
exclude = ["src/nomos/conectores/mcp/.*/servidor\\.py"]

[tool.setuptools.package-data]
# As skills base VIAJAM COM O WHEEL. Sem esta linha elas ficavam em
# `examples/` — fora de `src/`, logo inalcançáveis por package-data — e o CLI
# sugeria instalar de um caminho que só existe dentro do checkout. Mesmo
# padrão de `nomos.conectores` logo abaixo, que já funciona.
"nomos.skills_embutidas" = ["*/skill.json", "*/*.py", "*/*.md"]
# As do dono viajam igual, em pacote SEPARADO: `skills_embutidas` tem contrato
# de "4 oficiais, risco baixo" garantido por teste, e 29 de risco misto ali
# dentro apagariam essa promessa.
"nomos.skills_do_dono" = ["*/skill.json", "*/*.py", "*/*.md"]
"nomos.agents" = ["oficiais/*.json"]
"nomos.conectores" = ["mcp/_comum.py", "mcp/*/manifesto.json", "mcp/*/servidor.py", "mcp/*/README.md"]

[tool.pytest.ini_options]
# `slow` marca as baterias de CORRIDA (A9) e CAOS (A10): 12×30 iterações e
# injeção de falha em cada ponto. Ficam na suíte (não são opt-out), e o marcador
# só existe para permitir `-m "not slow"` num ciclo rápido de desenvolvimento.
markers = [
    "slow: bateria longa (corrida/caos) — roda por padrão, filtrável com -m 'not slow'",
    "motor_real: integração opt-in que PODE tocar um motor local vivo (Ollama/OpenAI-compat); sem esta marca o conftest bloqueia o socket para as portas reais",
]
