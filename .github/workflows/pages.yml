name: Publicar site (GitHub Pages)

# Publica a landing estática (site/) num link de teste do GitHub Pages.
# URL final (repo de projeto): https://voltolini-space.github.io/NOMOS/
#
# Pré-requisito (uma vez): Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Depois, todo push que mexa em site/ republica.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true      # habilita o Pages sozinho (usa o token pages:write)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site          # publica só a landing estática, nada do resto do repo
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
