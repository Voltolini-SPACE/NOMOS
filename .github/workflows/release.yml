name: Release

on:
  push:
    tags: ["v*"]

# Default de mínimo privilégio (H4.9/H4.10): contents:read para tudo.
# Apenas o job `publicar` sobrescreve com o mínimo que precisa para criar
# release + assinar SLSA. `validar` e `construir` executam código do repo
# mas com token somente-leitura — se algo malicioso rodar (teste, deps,
# ou tools/), não consegue escrever no repo nem obter OIDC token.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # JOB 1 — validar: suíte de testes / lint. Sem privilégio elevado.
  # -------------------------------------------------------------------
  validar:
    name: Suíte completa antes de publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Habilitar user namespaces (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Testes
        run: python -m pytest -q

  # -------------------------------------------------------------------
  # JOB 2 — construir: build + normalize + smoke + SBOM + SHA256SUMS +
  # upload-artifact. TAMBÉM SEM PRIVILÉGIO ELEVADO — se qualquer coisa
  # aqui for hostil, o dano fica na sandbox do job, sem OIDC.
  # H4.10 §5: código do repositório (python -m build, tools/*.py) só roda
  # neste job, nunca no publicar. Todos os artefatos vão para
  # `dist-verified/` e são consumidos read-only pelo próximo job.
  # -------------------------------------------------------------------
  construir:
    name: Construir e verificar artefatos
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Construir wheel + sdist (reproducible)
        # Contrato de reprodutibilidade H4.9: com o toolchain abaixo pinado
        # + SOURCE_DATE_EPOCH derivado do commit + PYTHONHASHSEED=0 + locale
        # C.UTF-8, dois builds independentes do MESMO SHA produzem wheel
        # sha256 idêntico (verificado empiricamente em macOS local × runner
        # Linux). Sdist diverge sozinho por bug conhecido em setuptools
        # (pypa/setuptools#2133) — normalização in-place faz convergir.
        env:
          PYTHONHASHSEED: "0"
          TZ: UTC
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ($(date -u -d @$SOURCE_DATE_EPOCH -Iseconds))"
          # Toolchain PINADO — versões exatas testadas em H4.9/H4.10.
          # Bump aqui exige rerodar tools/repro_check.py e a suíte de
          # tests/test_reproducible_sdist.py.
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "setuptools==83.0.0" \
            "wheel==0.45.1" \
            "build==1.5.0" \
            "packaging==26.3" \
            "pyproject_hooks==1.2.0"
          python -m build --no-isolation
          python tools/reproducible_sdist.py dist/*.tar.gz

      - name: Smoke do wheel construído + gerar SBOM
        env:
          PYTHONHASHSEED: "0"
          TZ: UTC
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          python -m venv /tmp/venv-release
          /tmp/venv-release/bin/pip install --quiet dist/*.whl
          /tmp/venv-release/bin/nomos --version
          NOMOS_HOME=/tmp/nomos-release-smoke /tmp/venv-release/bin/nomos doutor
          /tmp/venv-release/bin/python tools/make_sbom.py \
            dist/sbom.cdx.json dist/*.whl dist/*.tar.gz

      - name: Anexar instaladores e gerar SHA256SUMS
        run: |
          cp installer/install.sh installer/uninstall.sh installer/rollback.sh dist/
          cp installer/install.ps1 installer/uninstall.ps1 dist/
          cd dist
          sha256sum * > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Empacotar artefatos verificados
        # `dist-verified` contém EXATAMENTE o que será atestado e publicado.
        # O job publicar consome isso via download-artifact e nada mais.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-verified
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # -------------------------------------------------------------------
  # JOB 3 — publicar: privilégio elevado (id-token + attestations +
  # contents:write). H4.10 §5: NÃO executa checkout do código, NÃO roda
  # tools/*.py, NÃO instala o pacote, NÃO reconstrói artefatos. Só:
  #   1. Baixa dist-verified do job construir.
  #   2. Reverifica sha256sum -c SHA256SUMS.
  #   3. Assina SLSA-provenance (Sigstore/Fulcio via OIDC).
  #   4. Cria a release do GitHub.
  # -------------------------------------------------------------------
  publicar:
    name: Publicar release + attestation
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: write        # criar a release
      id-token: write        # obter OIDC token (Sigstore)
      attestations: write    # persistir attestation no repositório
    steps:
      - name: Baixar artefatos verificados
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-verified
          path: dist/

      - name: Reverificar hashes (defesa em profundidade)
        # Mesmo que o artifact intermediário do GitHub proteja em trânsito,
        # rechecar aqui garante que os bytes recebidos batem com o
        # SHA256SUMS gerado no job construir. Se alguém interceptar o
        # transporte de artifact, este passo falha fechado.
        run: |
          cd dist
          echo "--- SHA256SUMS recebido ---"
          cat SHA256SUMS
          echo "--- verificando ---"
          sha256sum -c SHA256SUMS

      - name: "Attestation SLSA de proveniência (wheel + sdist)"
        # `subject-path` aponta para arquivos JÁ NO DISCO (baixados no
        # step anterior). Nenhum código Python do repo executa aqui —
        # esta action é fornecida pelo próprio GitHub, escrita em
        # TypeScript, com SHA pinado por segurança.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Resolve release flags
        id: release_flags
        shell: bash
        run: |
          # RC tags (qualquer "v*rc*") nunca podem virar latest/final
          # automaticamente -- só uma tag final sem "rc" (ex.: v1.3.0) pode.
          if [[ "${{ github.ref_name }}" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=legacy" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
          generate_release_notes: true
          prerelease: ${{ steps.release_flags.outputs.prerelease }}
          make_latest: ${{ steps.release_flags.outputs.make_latest }}
          body: |
            Consulte o `CHANGELOG.md` para as novidades desta versão.

            **Instalação rápida** (detalhes em `docs/INSTALL.md`):
            - Mac/Linux: baixe `install.sh` + o `.whl`, rode `bash install.sh`
            - Windows: baixe `install.ps1` + o `.whl`, rode no PowerShell
            - ou apenas: `pip install nomos-*.whl`

            Verifique a integridade dos artefatos com `SHA256SUMS`
            (`sha256sum --check SHA256SUMS`).

            Esta release inclui `sbom.cdx.json` (CycloneDX 1.5): inventário
            de dependências para auditoria de supply chain.

            Para a proveniência criptográfica dos artefatos:
            `gh attestation verify <artefato> -R Voltolini-SPACE/NOMOS`.

            O NOMOS **nunca** se atualiza sozinho: para checar novidades,
            rode `nomos atualizar` (opt-in, com sua aprovação).
