name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validar:
    name: Suíte completa antes de publicar
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Habilitar user namespaces (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Testes
        run: python -m pytest -q

  publicar:
    name: Construir e publicar release
    needs: validar
    runs-on: ubuntu-latest
    # Escopo mínimo por-job: attestations exige id-token para assinar via
    # Sigstore/Fulcio; attestations:write persiste a atestação SLSA anexada
    # ao repositório. contents:write continua necessário para a criação da
    # release em si (softprops/action-gh-release).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Construir wheel + sdist
        # Reproducibilidade: SOURCE_DATE_EPOCH (padrão reproducible-builds.org)
        # fixa mtimes internos ao instante do commit da tag, para que dois
        # builds do mesmo SHA produzam artefatos com metadados normalizados.
        # PYTHONHASHSEED=0 elimina o outro grande vetor de não-determinismo
        # (ordenação de dicts durante o build). Bitwise-identity de wheel
        # continua fora do escopo (pip/build ainda embutem detalhes do
        # ambiente), mas a variação entre runs cai drasticamente.
        env:
          PYTHONHASHSEED: "0"
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ($(date -u -d @$SOURCE_DATE_EPOCH -Iseconds))"
          python -m pip install --upgrade pip build
          python -m build

      - name: "Attestation SLSA de proveniência (wheel + sdist)"
        # Emite uma atestação SLSA-provenance assinada por Sigstore/Fulcio
        # para cada artefato distribuível (wheel e sdist), antes de o dist/
        # receber instaladores/SBOM/SHA256SUMS. A verificação pelo
        # consumidor final é `gh attestation verify <artefato> -R
        # Voltolini-SPACE/NOMOS` — deve retornar sucesso e o predicate
        # https://slsa.dev/provenance/v1.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Smoke do wheel construído + gerar SBOM
        # SOURCE_DATE_EPOCH também para o SBOM: timestamp e serialNumber
        # deterministicos, e cada artefato distribuível (wheel/sdist) é
        # referenciado por sha256 dentro do SBOM — o SBOM deixa de "flutuar"
        # sobre o dist/, passa a apontar para os arquivos exatos que ele
        # descreve.
        env:
          PYTHONHASHSEED: "0"
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          python -m venv /tmp/venv-release
          /tmp/venv-release/bin/pip install --quiet dist/*.whl
          /tmp/venv-release/bin/nomos --version
          NOMOS_HOME=/tmp/nomos-release-smoke /tmp/venv-release/bin/nomos doutor
          /tmp/venv-release/bin/python tools/make_sbom.py \
            dist/sbom.cdx.json dist/*.whl dist/*.tar.gz

      - name: Anexar instaladores e gerar SHA256SUMS
        run: |
          cp installer/install.sh installer/uninstall.sh installer/rollback.sh dist/
          cp installer/install.ps1 installer/uninstall.ps1 dist/
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve release flags
        id: release_flags
        shell: bash
        run: |
          # RC tags (qualquer "v*rc*") nunca podem virar latest/final
          # automaticamente -- só uma tag final sem "rc" (ex.: v1.3.0) pode.
          if [[ "${{ github.ref_name }}" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=legacy" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true
          prerelease: ${{ steps.release_flags.outputs.prerelease }}
          make_latest: ${{ steps.release_flags.outputs.make_latest }}
          body: |
            Consulte o `CHANGELOG.md` para as novidades desta versão.

            **Instalação rápida** (detalhes em `docs/INSTALL.md`):
            - Mac/Linux: baixe `install.sh` + o `.whl`, rode `bash install.sh`
            - Windows: baixe `install.ps1` + o `.whl`, rode no PowerShell
            - ou apenas: `pip install nomos-*.whl`

            Verifique a integridade dos artefatos com `SHA256SUMS`
            (`sha256sum --check SHA256SUMS`).

            Esta release inclui `sbom.cdx.json` (CycloneDX 1.5): inventário
            de dependências para auditoria de supply chain.

            O NOMOS **nunca** se atualiza sozinho: para checar novidades,
            rode `nomos atualizar` (opt-in, com sua aprovação).
