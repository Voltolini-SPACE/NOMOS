name: Release

on:
  push:
    tags: ["v*"]

# Default de mínimo privilégio (H4.9): contents:read para o job de
# validação (que executa código do repo — pytest/ruff/pip install).
# O job publicar sobrescreve com o que efetivamente precisa
# (contents:write + id-token:write + attestations:write).
permissions:
  contents: read

jobs:
  validar:
    name: Suíte completa antes de publicar
    runs-on: ubuntu-latest
    # Explicit, para documentar: validar NUNCA precisa escrever no repo,
    # emitir attestation ou obter OIDC. Se um teste ou uma dep de teste
    # for maliciosa, o GITHUB_TOKEN dela só lê.
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Habilitar user namespaces (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Testes
        run: python -m pytest -q

  publicar:
    name: Construir e publicar release
    needs: validar
    runs-on: ubuntu-latest
    # Escopo mínimo por-job: attestations exige id-token para assinar via
    # Sigstore/Fulcio; attestations:write persiste a atestação SLSA anexada
    # ao repositório. contents:write continua necessário para a criação da
    # release em si (softprops/action-gh-release).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Construir wheel + sdist (reproducible)
        # Contrato de reprodutibilidade H4.9: com o toolchain abaixo pinado
        # + SOURCE_DATE_EPOCH derivado do commit + PYTHONHASHSEED=0 + locale
        # C.UTF-8, dois builds independentes do MESMO SHA produzem wheel
        # sha256 idêntico (verificado empiricamente em macOS local × runner
        # Linux — hash bateu). O SDIST diverge sozinho por bug conhecido em
        # setuptools (pypa/setuptools#2133) — normalização in-place logo
        # abaixo faz o hash convergir também.
        env:
          PYTHONHASHSEED: "0"
          TZ: UTC
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ($(date -u -d @$SOURCE_DATE_EPOCH -Iseconds))"
          # Toolchain PINADO — versões exatas testadas em H4.9. Qualquer
          # bump aqui exige rerodar o experimento forense de reprodução
          # (tools/reproducible_sdist.py + tests/test_reproducible_sdist.py
          # + tests/test_make_sbom.py + tests/test_reproducible_build.py).
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "setuptools==83.0.0" \
            "wheel==0.45.1" \
            "build==1.5.0" \
            "packaging==26.3" \
            "pyproject_hooks==1.2.0"
          # --no-isolation: usar o venv atual (com pins acima) como env de
          # build. Sem isso, `build` cria um venv temporário que puxa a
          # versão MAIS RECENTE de setuptools disponível a cada run, o que
          # quebra reprodutibilidade.
          python -m build --no-isolation
          # Normaliza o sdist: reescreve tar members (mtime, uid, gid,
          # uname, gname, mode) e o header gzip. Preserva nomes e conteúdo.
          # O artefato NORMALIZADO é o sujeito de attestation + SBOM +
          # SHA256SUMS abaixo.
          python tools/reproducible_sdist.py dist/*.tar.gz

      - name: "Attestation SLSA de proveniência (wheel + sdist)"
        # Emite uma atestação SLSA-provenance assinada por Sigstore/Fulcio
        # para cada artefato distribuível (wheel e sdist), antes de o dist/
        # receber instaladores/SBOM/SHA256SUMS. A verificação pelo
        # consumidor final é `gh attestation verify <artefato> -R
        # Voltolini-SPACE/NOMOS` — deve retornar sucesso e o predicate
        # https://slsa.dev/provenance/v1.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Smoke do wheel construído + gerar SBOM
        # SOURCE_DATE_EPOCH também para o SBOM: timestamp e serialNumber
        # deterministicos, e cada artefato distribuível (wheel/sdist) é
        # referenciado por sha256 dentro do SBOM — o SBOM deixa de "flutuar"
        # sobre o dist/, passa a apontar para os arquivos exatos que ele
        # descreve.
        env:
          PYTHONHASHSEED: "0"
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          python -m venv /tmp/venv-release
          /tmp/venv-release/bin/pip install --quiet dist/*.whl
          /tmp/venv-release/bin/nomos --version
          NOMOS_HOME=/tmp/nomos-release-smoke /tmp/venv-release/bin/nomos doutor
          /tmp/venv-release/bin/python tools/make_sbom.py \
            dist/sbom.cdx.json dist/*.whl dist/*.tar.gz

      - name: Anexar instaladores e gerar SHA256SUMS
        run: |
          cp installer/install.sh installer/uninstall.sh installer/rollback.sh dist/
          cp installer/install.ps1 installer/uninstall.ps1 dist/
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve release flags
        id: release_flags
        shell: bash
        run: |
          # RC tags (qualquer "v*rc*") nunca podem virar latest/final
          # automaticamente -- só uma tag final sem "rc" (ex.: v1.3.0) pode.
          if [[ "${{ github.ref_name }}" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=legacy" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
          generate_release_notes: true
          prerelease: ${{ steps.release_flags.outputs.prerelease }}
          make_latest: ${{ steps.release_flags.outputs.make_latest }}
          body: |
            Consulte o `CHANGELOG.md` para as novidades desta versão.

            **Instalação rápida** (detalhes em `docs/INSTALL.md`):
            - Mac/Linux: baixe `install.sh` + o `.whl`, rode `bash install.sh`
            - Windows: baixe `install.ps1` + o `.whl`, rode no PowerShell
            - ou apenas: `pip install nomos-*.whl`

            Verifique a integridade dos artefatos com `SHA256SUMS`
            (`sha256sum --check SHA256SUMS`).

            Esta release inclui `sbom.cdx.json` (CycloneDX 1.5): inventário
            de dependências para auditoria de supply chain.

            O NOMOS **nunca** se atualiza sozinho: para checar novidades,
            rode `nomos atualizar` (opt-in, com sua aprovação).
